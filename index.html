<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050608">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NOCTIS · Treino</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050608; --bg2:#0a0c11; --card:#10131a; --card2:#151923; --line:#1e2430; --line2:#2a3140;
  --text:#e9ebf1; --muted:#8b93a6; --dim:#5b6375;
  --acc:#f2b705; --acc2:#ffcf3f; --accGlow:rgba(242,183,5,.35);
  --steel:#5aa9ff; --ok:#33d17a; --bad:#ff4d5e;
  --r:18px; --fh:Oxanium,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 60% at 50% -10%,rgba(90,169,255,.10),transparent 60%),
             radial-gradient(80% 50% at 100% 0%,rgba(242,183,5,.07),transparent 60%);}
h1,h2,h3,.num,.tab b,.brand{font-family:var(--fh);letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(var(--safeT) + 8px) 16px calc(96px + var(--safeB))}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.18em}
.brand svg{width:30px;height:30px;filter:drop-shadow(0 0 8px var(--accGlow))}
.brand small{display:block;font-family:Inter;font-weight:500;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.card.glow{border-color:rgba(242,183,5,.35);box-shadow:0 0 0 1px rgba(242,183,5,.08),0 10px 40px -10px rgba(242,183,5,.25)}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .num{font-size:24px;font-weight:700}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.acc{color:var(--acc)} .steel{color:var(--steel)} .ok{color:var(--ok)} .bad{color:var(--bad)}
.btn{text-decoration:none;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card2);padding:11px 16px;border-radius:14px;font-weight:600;cursor:pointer;transition:transform .12s, background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#111;border:none;box-shadow:0 8px 24px -8px var(--accGlow)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,77,94,.35)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.iconbtn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card2);cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.tbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card2);cursor:pointer;text-align:left;position:relative;overflow:hidden}
.tbtn .L{font-family:var(--fh);font-size:30px;font-weight:800;line-height:1}
.tbtn.sug{border-color:var(--acc);box-shadow:inset 0 0 30px -12px var(--accGlow)}
.tbtn.sug::after{content:"HOJE";position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.12em;color:#111;background:var(--acc);padding:2px 6px;border-radius:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.day{text-align:center;padding:8px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.day b{display:block;font-family:var(--fh);font-size:15px;color:var(--text)}
.day.on{border-color:var(--acc);color:#111;background:linear-gradient(180deg,var(--acc2),var(--acc))}
.day.on b{color:#111}
.day.today{outline:1px dashed var(--steel);outline-offset:2px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(8px + var(--safeB));background:rgba(5,6,8,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:none;background:none;color:var(--dim);font-size:10.5px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab b{font-weight:600;font-size:10.5px;letter-spacing:.06em}
.tab.on{color:var(--acc)}
.tab.on svg{filter:drop-shadow(0 0 6px var(--accGlow))}
/* list */
.ex{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.thumb{width:64px;height:48px;border-radius:10px;background:#0b0d12 center/cover no-repeat;border:1px solid var(--line);flex:none;position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .mini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ex .t{flex:1;min-width:0}
.ex .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:6px;background:rgba(51,209,122,.14);color:var(--ok);margin-left:6px;vertical-align:middle}
.chip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(242,183,5,.12);color:var(--acc);margin:2px 4px 2px 0}
.chip.s{background:rgba(90,169,255,.12);color:var(--steel)}
/* session */
.sx{border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.sx.done{border-color:rgba(51,209,122,.4)}
.sxh{display:flex;gap:12px;align-items:center;padding:12px}
.sxh .t{flex:1;min-width:0}
.sxh .t b{font-size:15px}
.sets{padding:0 12px 12px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.set.cardio{grid-template-columns:1fr 1fr 1fr 44px}
.set .n{font-family:var(--fh);color:var(--muted);text-align:center;font-weight:700}
.inp{width:100%;background:#0a0c11;border:1px solid var(--line2);border-radius:12px;padding:10px 10px;font-family:var(--fh);font-size:17px;font-weight:600;text-align:center;outline:none}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(242,183,5,.15)}
.inp::placeholder{color:#3f4656;font-weight:500}
.lab{font-size:10px;color:var(--dim);text-align:center;text-transform:uppercase;letter-spacing:.1em}
.chk{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:#0a0c11;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06210f;box-shadow:0 0 16px -4px rgba(51,209,122,.7)}
.hint{font-size:12px;color:var(--muted);padding:0 12px 10px}
.hint .up{color:var(--ok);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.field input,.field select,.field textarea{background:#0a0c11;border:1px solid var(--line2);border-radius:12px;padding:11px 12px;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + var(--safeB));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:-6px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000 center/cover no-repeat;border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.55));cursor:pointer;border:none;width:100%}
.play span{width:64px;height:64px;border-radius:50%;background:rgba(242,183,5,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px var(--accGlow)}
.body{display:flex;gap:6px;justify-content:center}
.body svg{width:48%;max-width:170px;height:auto;max-height:320px}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* timer */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safeB));z-index:30;display:none;align-items:center;gap:12px;padding:10px 14px 10px 18px;border-radius:99px;background:#10131a;border:1px solid var(--acc);box-shadow:0 10px 40px -8px var(--accGlow)}
#rest .num{font-size:22px;font-weight:700;color:var(--acc);min-width:58px}
.sessbar{position:sticky;top:0;z-index:15;margin:0 -16px 12px;padding:calc(var(--safeT) + 10px) 16px 10px;background:rgba(5,6,8,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.prog{height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 10px var(--accGlow)}
canvas{width:100%;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--card2);color:var(--muted);font-family:var(--fh)}
.cal div.on{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#111;font-weight:700;box-shadow:0 0 12px -3px var(--accGlow)}
.cal div.x{background:transparent}
.cal .h{background:transparent;font-size:10px;aspect-ratio:auto;padding-bottom:2px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer}
.seg button.on{background:var(--line2);color:var(--text)}
.meal{padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.meal b{font-family:var(--fh)}
.meal ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.meal li{margin:2px 0}
.meal li span{color:var(--text)}
.toast{position:fixed;left:50%;top:calc(var(--safeT) + 14px);transform:translateX(-50%);z-index:80;background:var(--card2);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fade .2s}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.skyline{position:absolute;left:0;right:0;bottom:0;height:70px;opacity:.5;pointer-events:none}
.hr{height:1px;background:var(--line);margin:12px 0}
.reorder{display:flex;flex-direction:column;gap:4px}
.reorder button{width:30px;height:22px;border-radius:7px;border:1px solid var(--line);background:#0a0c11;cursor:pointer;display:flex;align-items:center;justify-content:center}
.small{font-size:12px}
table.h{width:100%;border-collapse:collapse;font-size:13px}
table.h td,table.h th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.h th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.mealchk{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:#0a0c11;cursor:pointer;font-size:13px;text-align:left}
.mealchk span{color:var(--muted);font-family:var(--fh)}.mealchk.on{border-color:var(--ok);background:rgba(51,209,122,.12)}.mealchk.on span{color:var(--ok)}
.opt{padding:14px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);margin-bottom:8px;cursor:pointer}.opt.on{border-color:var(--acc);box-shadow:inset 0 0 24px -12px var(--accGlow)}
.sign{text-align:center;color:var(--dim);font-size:12px;margin:22px 0 6px;letter-spacing:.04em;line-height:1.8}.sign b{color:var(--acc);font-weight:600}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#0a0c11;border:1px solid var(--line);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph span{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.cmp b{display:block;font-family:var(--fh);margin-top:6px}.cmp span{font-size:12px;color:var(--muted)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:#0a0c11;border:1px solid var(--line2)}
.swrow .num{font-size:24px;font-weight:700;color:var(--acc)}
#restLbl{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.mini{display:inline-flex;padding:2px}.seg.mini button{padding:4px 11px;flex:none;font-size:12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}.switch input{width:26px;height:26px;accent-color:var(--acc);flex:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest"><div><div class="small sub" id="restLbl">Descanso</div><div class="num" id="restNum">1:30</div></div>
  <button class="btn sm" onclick="Rest.add(15)">+15s</button><button class="btn sm ghost" onclick="Rest.stop()">Pular</button></div>
<nav class="tabs" id="tabs"><div class="in"></div></nav>
<div id="modals"></div>

<script>
/* ===================== DADOS BASE ===================== */

  quadriceps:'Quadríceps', adutores:'Adutores', abdutores:'Glúteo médio', panturrilha:'Panturrilha',
  trapezio:'Trapézio', dorsal:'Dorsal (latíssimo)', lombar:'Lombar', gluteo:'Glúteo', posterior:'Posterior de coxa'
};
function E(id,nome,p,s,video,tipo){return {id,nome,musc:{p,s},video,tipo:tipo||'forca',foto:null,obs:''}}
const SEED_EX = [
 E('supino_maq','Supino reto na máquina',['peito'],['ombro_ant','triceps'],'qmSOsrheLEg'),
 E('desenv_maq','Desenvolvimento de ombro na máquina',['ombro_ant','ombro_lat'],['triceps','trapezio'],'Q7K6DI9R-A8'),

 E('panturrilha','Panturrilha na máquina',['panturrilha'],[],'qWHH0We_9r0'),
 E('puxada_frente','Puxada frente na polia',['dorsal'],['biceps','ombro_post','trapezio'],'BOW9my4J_ek'),
 E('remada_sent','Remada sentada na máquina',['dorsal','trapezio'],['ombro_post','biceps'],'WerTQoDj-_g'),
 E('remada_uni','Remada unilateral com halter',['dorsal'],['ombro_post','biceps','trapezio'],'34HQ55Yds6o'),
 E('face_pull','Face pull ou remada alta na polia',['ombro_post','trapezio'],['ombro_lat'],'YxQivR_kljk'),
 E('rosca_direta','Rosca direta na barra ou polia',['biceps'],['antebraco'],'yopIHJ-jr3w'),
 E('abd_maq','Abdominal na máquina',['abdomen'],['obliquos'],'_g6RCj4cq4I'),
 E('puxada_neutra','Puxada frente com pegada neutra',['dorsal'],['biceps','trapezio'],'ktPLR6vCb1g'),
 E('prancha','Prancha isométrica',['abdomen'],['obliquos','lombar','ombro_ant'],'OnVIGDpnMow','tempo'),
];
function I(exId,series,repMin,repMax,nota,novo,descanso){return {exId,series,repMin,repMax,nota:nota||'',novo:!!novo,descanso:descanso||60}}
const SEED_TREINOS = [
 {id:'A',nome:'Treino A',dia:1,foco:'Peito, ombro e tríceps',itens:[
  I('supino_maq',3,8,12,'Costas apoiadas, cotovelos um pouco abaixo da linha do ombro.',0,90),
  I('desenv_maq',3,8,12,'Subir sem travar o cotovelo no topo.',0,90),
  I('sup_incl_hal',3,10,12,'Banco a 30°. Constrói a parte de cima do peito, que dá o formato atlético.',1,75),
  I('peck_deck',2,12,15,'Fechar até quase encostar os braços e voltar controlando.'),
  I('elev_lat',3,12,15,'Peso leve, até a altura do ombro. É o exercício que alarga os ombros.'),
  I('triceps_polia',3,10,15,'Cotovelo colado ao corpo, só o antebraço se move.'),
  I('caminhada',1,12,15,'Inclinação de 6 a 10%, velocidade de 5 a 5,5 km/h. Deve dar para conversar, mas com esforço.')]},

  put(k,v){return this.tx('readwrite',s=>s.put(v,k))},get(k){return this.tx('readonly',s=>s.get(k))},del(k){return this.tx('readwrite',s=>s.delete(k))},clear(){return this.tx('readwrite',s=>s.clear())}};

function sugerido(){
  if(!S.treinos.length)return null;
  const dow=new Date().getDay();const t=S.treinos.find(t=>t.dia===dow);if(t)return t.id;
  const last=S.sessoes[S.sessoes.length-1];if(!last)return S.treinos[0].id;
  const i=S.treinos.findIndex(t=>t.id===last.treinoId);return S.treinos[(i+1)%S.treinos.length].id;
}
function lastPerf(exId,beforeId){
  for(let i=S.sessoes.length-1;i>=0;i--){const s=S.sessoes[i];if(s.id===beforeId)continue;
    const it=s.itens.find(x=>x.exId===exId&&x.sets.some(z=>z.ok));if(it)return {sess:s,it};}
  return null;
}
function shouldIncrease(item,lp){
  if(!lp||!item)return false;const ex=S.ex[item.exId];if(!ex||ex.tipo!=='forca')return false;
  const ok=lp.it.sets.filter(z=>z.ok);if(ok.length<item.series)return false;
  return ok.every(z=>(num(z.reps)||0)>=item.repMax);
}
function incOf(ex){return /halter/i.test(ex.nome)?2:2.5}
function prs(exId,skipId){let kg=0,e1=0,vol=0;
  S.sessoes.forEach(s=>{if(s.id===skipId)return;s.itens.forEach(i=>{if(i.exId!==exId)return;let v=0;
    i.sets.forEach(z=>{if(!z.ok)return;const k=num(z.kg)||0,r=num(z.reps)||0;if(k>kg)kg=k;const e=k*(1+r/30);if(e>e1)e1=e;v+=k*r});if(v>vol)vol=v})});
  return {kg,e1,vol}}
function startSession(tid){
  if(S.ativa&&S.ativa.treinoId!==tid){confirmBox('Já existe um treino em andamento. Descartar e começar o '+tById(tid).nome+'?',()=>{S.ativa=null;startSession(tid)});return}
  if(!S.ativa){
    const t=tById(tid);
    S.ativa={id:uid(),treinoId:tid,inicio:new Date().toISOString(),itens:t.itens.filter(it=>S.ex[it.exId]).map(it=>{
      const ex=S.ex[it.exId];const lp=lastPerf(it.exId);let sug=0,base='';
      if(ex.tipo==='forca'&&lp&&shouldIncrease(it,lp)){const mx=Math.max(0,...lp.it.sets.filter(z=>z.ok).map(z=>num(z.kg)||0));if(mx>0){sug=incOf(ex);base=String(Math.round((mx+sug)*10)/10)}}
      const sets=[];
      for(let i=0;i<it.series;i++){const prev=lp&&lp.it.sets[i];
        if(ex.tipo==='cardio')sets.push({min:prev?prev.min:'',incl:prev?prev.incl:'',vel:prev?prev.vel:'',ok:false});
        else sets.push({kg:base||(prev?prev.kg:''),reps:'',ok:false});}
      return {exId:it.exId,sets,nota:'',sug};})};
    save();
  }
  wake(true);go('sessao');
}
let wl=null;async function wake(on){try{if(on&&'wakeLock'in navigator){wl=await navigator.wakeLock.request('screen')}else if(wl){wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&view==='sessao')wake(true)});

  let h=`<div class="sessbar"><button class="iconbtn" onclick="go('home')">${ICON.back}</button>

    if(plan.nota)h+=`<div class="hint" style="color:var(--dim)">${esc(plan.nota)}</div>`;
    if(it.sug)h+=`<div class="hint"><span class="up">▲ Carga sugerida hoje: ${esc(it.sets[0]?.kg||'')} kg (+${fmt(it.sug,1)})</span> · você bateu o topo da faixa na última vez.</div>`;
    if(lp){const ls=lp.it.sets.filter(z=>z.ok);
      h+=`<div class="hint">Última (${dLabel(lp.sess.inicio)}): ${ls.map(z=>ex.tipo==='cardio'?`${z.min||'–'}min ${z.incl||'–'}% ${z.vel||'–'}km/h`:ex.tipo==='tempo'?`${z.reps||'–'}s`:`${z.kg||0}kg×${z.reps||'–'}`).join(' · ')}</div>`}
    h+=`<div class="sets">`;
    if(ex.tipo!=='forca'){const on=Sw.i===ii;const meta=ex.tipo==='tempo'?(plan.repMax?` · meta ${plan.repMax} s`:''):(plan.repMax?` · meta ${plan.repMax} min`:'');
      h+=`<div class="swrow"><div><div class="lab" style="text-align:left">Cronômetro${meta}</div><span class="num" id="sw${ii}">${on?swTxt():'00:00'}</span></div><button class="btn sm ${on?'danger':'pri'}" onclick="swToggle(${ii})">${on?'Parar e lançar':'▶ Iniciar'}</button></div>`}
    if(ex.tipo==='cardio'){
      h+=`<div class="set cardio"><div class="lab">Minutos</div><div class="lab">Inclinação %</div><div class="lab">km/h</div><div></div></div>`;
      it.sets.forEach((z,si)=>{h+=`<div class="set cardio">
        <input class="inp" inputmode="decimal" placeholder="${plan.repMin||''}" value="${esc(z.min)}" oninput="setV(${ii},${si},'min',this.value)">
        <input class="inp" inputmode="decimal" placeholder="8" value="${esc(z.incl)}" oninput="setV(${ii},${si},'incl',this.value)">
        <input class="inp" inputmode="decimal" placeholder="5,2" value="${esc(z.vel)}" oninput="setV(${ii},${si},'vel',this.value)">

    }else{

      it.sets.forEach((z,si)=>{const pv=lp&&lp.it.sets[si];h+=`<div class="set"><div class="n">${si+1}</div>
        <input class="inp" inputmode="decimal" placeholder="${pv&&pv.kg?esc(pv.kg):'kg'}" value="${esc(z.kg)}" oninput="setV(${ii},${si},'kg',this.value)">
        <input class="inp" inputmode="numeric" placeholder="${pv&&pv.reps?esc(pv.reps):(plan.repMin?plan.repMin+(plan.repMax!==plan.repMin?'–'+plan.repMax:''):'')}" value="${esc(z.reps)}" oninput="setV(${ii},${si},'reps',this.value)">

  });
  h+=`<button class="btn sm" style="margin-bottom:14px" onclick="pickEx(addToday)">${ICON.plus.replace('<svg','<svg width=14 height=14')} Adicionar exercício só hoje</button>

function addToday(id){const c=S.ex[id].tipo==='cardio';S.ativa.itens.push({exId:id,sets:c?[{min:'',incl:'',vel:'',ok:false}]:[{kg:'',reps:'',ok:false},{kg:'',reps:'',ok:false},{kg:'',reps:'',ok:false}],nota:''});save();render()}
function planTxt(p,ex){if(!p||!p.series)return '';if(ex.tipo==='cardio')return `${p.repMin}${p.repMax!==p.repMin?'–'+p.repMax:''} min`;
  return `${p.series}×${p.repMin}${p.repMax!==p.repMin?'–'+p.repMax:''}${ex.tipo==='tempo'?' s':''}`}
function setV(i,s,k,v){S.ativa.itens[i].sets[s][k]=v;save()}
function tick(i,s){
  const it=S.ativa.itens[i];const z=it.sets[s];const ex=S.ex[it.exId];const plan=tById(S.ativa.treinoId)?.itens.find(p=>p.exId===ex.id);
  z.ok=!z.ok;
  if(z.ok){
    if(ex.tipo!=='cardio'){
      if(!z.reps){const lp=lastPerf(ex.id,S.ativa.id);const pv=lp&&lp.it.sets[s];z.reps=pv&&pv.reps?pv.reps:(plan?String(plan.repMax):'')}
      if(!z.kg&&s>0&&it.sets[s-1].kg)z.kg=it.sets[s-1].kg;
      if(!z.kg){const lp=lastPerf(ex.id,S.ativa.id);const pv=lp&&lp.it.sets[s];if(pv&&pv.kg)z.kg=pv.kg}
    }else if(!z.min&&plan)z.min=String(plan.repMin);
    if(ex.tipo==='forca'){const k=num(z.kg)||0;const p=prs(ex.id,S.ativa.id);
      const cur=it.sets.reduce((m,q,qi)=>qi!==s&&q.ok?Math.max(m,num(q.kg)||0):m,0);
      if(p.kg>0&&k>p.kg&&k>cur)toast('🏆 Novo recorde de carga: '+fmt(k,1)+' kg')}
    const done=it.sets.every(q=>q.ok);
    const nxt=S.ativa.itens.findIndex((q,qi)=>qi>i&&!q.sets.every(w=>w.ok));
    if(done&&nxt>=0&&S.cfg.transicao>0)Rest.start(S.cfg.transicao,'Próximo: '+(S.ex[S.ativa.itens[nxt].exId]?.nome||''));
    else if(!done&&ex.tipo!=='cardio')Rest.start(plan?.descanso||60,'Descanso');
    else if(done&&nxt<0)Rest.stop();
    vibrate(30);
  }
  save();rr();
}
function addSet(i){const it=S.ativa.itens[i];const l=it.sets[it.sets.length-1]||{};it.sets.push(S.ex[it.exId].tipo==='cardio'?{min:'',incl:l.incl||'',vel:l.vel||'',ok:false}:{kg:l.kg||'',reps:'',ok:false});save();rr()}
function rmSet(i){const it=S.ativa.itens[i];if(it.sets.length>1){it.sets.pop();save();rr()}}
function finish(){
  const a=S.ativa;const any=a.itens.some(i=>i.sets.some(z=>z.ok));
  const doIt=()=>{a.fim=new Date().toISOString();a.itens=a.itens.filter(i=>i.sets.some(z=>z.ok));const html=resumoHTML(a);
    S.sessoes.push(a);S.ativa=null;Sw.i=null;save();wake(false);Rest.stop();go('evol');modal(html)};
  if(!any){confirmBox('Nenhuma série foi marcada como feita. Finalizar assim mesmo? (nada será salvo)',()=>{S.ativa=null;Sw.i=null;save();go('home')});return}
  const pend=a.itens.reduce((n,i)=>n+i.sets.filter(z=>!z.ok).length,0);
  if(pend)confirmBox(`Ainda há ${pend} série(s) sem marcar. Elas não entram no histórico. Finalizar?`,doIt);else doIt();
}
function resumoHTML(a){
  const t=tById(a.treinoId);const dur=Math.max(1,Math.round((new Date(a.fim)-new Date(a.inicio))/60000));
  let series=0,vol=0;const recs=[];
  a.itens.forEach(it=>{const ex=S.ex[it.exId];const ok=it.sets.filter(z=>z.ok);series+=ok.length;if(!ex||ex.tipo!=='forca')return;
    const kg=Math.max(0,...ok.map(z=>num(z.kg)||0));const e1=Math.max(0,...ok.map(z=>(num(z.kg)||0)*(1+(num(z.reps)||0)/30)));
    const v=ok.reduce((s,z)=>s+(num(z.kg)||0)*(num(z.reps)||0),0);vol+=v;const p=prs(it.exId,a.id);
    if(p.kg>0&&kg>p.kg)recs.push(`<b>${esc(ex.nome)}</b>: carga ${fmt(kg,1)} kg <span class="sub">(antes ${fmt(p.kg,1)})</span>`);
    else if(p.e1>0&&e1>p.e1+0.05)recs.push(`<b>${esc(ex.nome)}</b>: força estimada ${fmt(e1,1)} kg`);
    else if(p.vol>0&&v>p.vol)recs.push(`<b>${esc(ex.nome)}</b>: volume ${fmt(v)} kg`);});
  const prev=[...S.sessoes].reverse().find(s=>s.treinoId===a.treinoId);let cmp='';
  if(prev){const pv=prev.itens.reduce((n,i)=>n+i.sets.filter(z=>z.ok).reduce((b,z)=>b+(num(z.kg)||0)*(num(z.reps)||0),0),0);
    if(pv>0&&vol>0){const d=(vol-pv)/pv*100;cmp=`<div class="sub" style="margin-top:10px;text-align:center">Volume comparado ao último ${esc(t?t.nome:'treino')}: <b class="${d>=0?'ok':'bad'}">${d>=0?'+':''}${fmt(d)}%</b></div>`}}
  return `<div style="text-align:center"><div style="width:56px;height:56px;margin:0 auto 6px">${LOGO}</div><h2 style="margin:0">Treino concluído</h2><div class="sub">${esc(t?t.nome:'')} · ${dLabel(a.inicio)}</div></div>
   <div class="grid3" style="margin:14px 0"><div class="stat"><div class="num">${dur}</div><div class="lbl">${dur===1?'minuto':'minutos'}</div></div><div class="stat"><div class="num">${series}</div><div class="lbl">séries</div></div><div class="stat"><div class="num">${vol>=1000?fmt(vol/1000,1)+'t':fmt(vol)}</div><div class="lbl">${vol>=1000?'toneladas':'kg'} de volume</div></div></div>
   ${recs.length?`<div class="card glow" style="padding:12px;margin:0"><h3>🏆 Recordes de hoje</h3>${recs.map(r=>`<div style="margin:5px 0">${r}</div>`).join('')}</div>`:''}${cmp}
   <button class="btn pri block" style="margin-top:14px" onclick="closeModals()">Fechar</button>`;
}
const Sw={i:null,start:0,beeped:false};
function swTxt(){const s=Math.floor((Date.now()-Sw.start)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function swToggle(ii){
  if(Sw.i===ii){const sec=Math.round((Date.now()-Sw.start)/1000);Sw.i=null;const it=S.ativa.itens[ii];const ex=S.ex[it.exId];
    let k=it.sets.findIndex(z=>!z.ok);if(k<0){it.sets.push(ex.tipo==='cardio'?{min:'',incl:'',vel:'',ok:false}:{kg:'',reps:'',ok:false});k=it.sets.length-1}
    const z=it.sets[k];if(ex.tipo==='cardio')z.min=String(Math.max(1,Math.round(sec/60)));else z.reps=String(sec);
    tick(ii,k);return}
  if(Sw.i!==null){toast('Pare o outro cronômetro primeiro');return}
  Sw.i=ii;Sw.start=Date.now();Sw.beeped=false;Rest.stop();rr();
}

      if(alvo&&!Sw.beeped&&(Date.now()-Sw.start)/1000>=alvo){Sw.beeped=true;beep();vibrate([200,100,200]);toast('Meta de tempo atingida')}}}

/* descanso */
const Rest={end:0,iv:null,
  start(sec,label){this.end=Date.now()+sec*1000;const l=$('#restLbl');if(l)l.textContent=label||'Descanso';$('#rest').style.display='flex';clearInterval(this.iv);this.iv=setInterval(()=>this.tick(),250);this.tick()},
  add(s){this.end+=s*1000;this.tick()},
  stop(){clearInterval(this.iv);$('#rest').style.display='none'},
  tick(){const r=Math.max(0,Math.ceil((this.end-Date.now())/1000));$('#restNum').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');
    if(r<=0){this.stop();beep();vibrate([200,100,200])}}};
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)})}catch(e){}}

function weekDates(){const d=new Date();const day=(d.getDay()+6)%7;const mon=new Date(d);mon.setDate(d.getDate()-day);return [...Array(7)].map((_,i)=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x})}
function toLocalISO(iso){const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function trainedSet(){return new Set(S.sessoes.map(s=>toLocalISO(s.inicio)))}
function streakWeeks(){const set=trainedSet();let w=0;const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));
  for(let k=0;k<104;k++){let any=false;for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);if(set.has(toLocalISO(x.toISOString())))any=true}
    if(any)w++;else if(k>0)break;d.setDate(d.getDate()-7)}return w}

/* ===================== BUSCA DE VÍDEOS (YouTube Data API) ===================== */
const YTK='noctis.ytkey';
const YT_PADRAO='AIzaSyC56aKCa-FUKnrE7BOBa6B5UjgpmRp0rc0';
function ytKeyCustom(){try{return localStorage.getItem(YTK)||''}catch(e){return ''}}
function ytKey(){return ytKeyCustom()||YT_PADRAO}
function salvarKey(){const v=($('#ytk').value||'').trim();try{v?localStorage.setItem(YTK,v):localStorage.removeItem(YTK)}catch(e){}toast(v?'Chave própria salva':'Usando a chave padrão do app')}
function decodeHtml(t){const x=document.createElement('textarea');x.innerHTML=t;return x.value}
async function ytApi(q){
  const key=ytKey();if(!key)throw new Error('Cadastre a chave em Ajustes');
  if(!navigator.onLine)throw new Error('Sem internet agora');
  const u='https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=6&videoEmbeddable=true&relevanceLanguage=pt&regionCode=BR&safeSearch=strict&q='+encodeURIComponent(q+' execução correta')+'&key='+encodeURIComponent(key);
  let r;try{r=await fetch(u)}catch(e){throw new Error('Não consegui conectar ao YouTube')}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const m=(d.error&&d.error.message)||'';const why=(d.error&&d.error.errors&&d.error.errors[0]&&d.error.errors[0].reason)||'';
    if(/quota/i.test(m+why))throw new Error('Cota diária da chave esgotada. Volta amanhã.');
    if(/referer|referrer|blocked/i.test(m+why))throw new Error('Chave bloqueada para este site. Confira a restrição: kleberskyline-commits.github.io/*');
    if(/not valid|invalid/i.test(m+why))throw new Error('Chave inválida. Copie de novo no Google Cloud.');
    if(/has not been used|disabled/i.test(m))throw new Error('Ative a YouTube Data API v3 no projeto do Google Cloud.');
    throw new Error('Erro do YouTube: '+(m||r.status))}
  return (d.items||[]).filter(i=>i.id&&i.id.videoId).map(i=>({id:i.id.videoId,titulo:decodeHtml(i.snippet.title||''),canal:decodeHtml(i.snippet.channelTitle||''),thumb:(i.snippet.thumbnails&&(i.snippet.thumbnails.medium||i.snippet.thumbnails.default)||{}).url}));
}
async function buscarVideos(exId,q,onPick){
  const box=$('#ytRes');if(!box)return;const nome=q||(exId&&S.ex[exId]?S.ex[exId].nome:'');
  if(!nome.trim()){toast('Digite o nome do exercício primeiro');return}
  box.innerHTML='<div class="empty">Buscando vídeos…</div>';
  try{const res=await ytApi(nome);
    if(!res.length){box.innerHTML='<div class="empty">Nenhum vídeo encontrado.</div>';return}
    window._ytPick=i=>{const v=res[i];if(onPick){onPick(v);box.innerHTML='';return}S.ex[exId].video=v.id;save();closeModals();render();openEx(exId);toast('Vídeo atualizado')};
    box.innerHTML='<div class="sub small" style="margin:0 0 8px">Toque no vídeo que quer usar:</div>'+res.map((v,i)=>`<div class="ex" onclick="_ytPick(${i})"><div class="thumb">${v.thumb?`<img src="${esc(v.thumb)}" alt="" onerror="this.remove()">`:''}</div><div class="t"><b style="white-space:normal">${esc(v.titulo)}</b><div class="sub small">${esc(v.canal)}</div></div></div>`).join('');
  }catch(e){box.innerHTML=`<div class="sub small bad" style="margin-bottom:10px">${esc(e.message)}</div>`}
}

function weeklyCounts(n){const out=[];const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));

    out.push({lbl:a.getDate()+'/'+(a.getMonth()+1),v:new Set(S.sessoes.filter(s=>{const t=new Date(s.inicio);return t>=a&&t<b}).map(s=>toLocalISO(s.inicio))).size})}return out}

/* gráfico simples em canvas */
function chart(cv,o){
  if(!cv)return;const dpr=window.devicePixelRatio||1;if(!cv.dataset.h)cv.dataset.h=cv.getAttribute('height');const W=cv.clientWidth,H=+cv.dataset.h;cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const c=cv.getContext('2d');c.scale(dpr,dpr);const L=40,R=10,T=12,B=26;const pw=W-L-R,ph=H-T-B;
  const vals=[...(o.bars||[]),...(o.lines||[]).flatMap(l=>l.data.filter(v=>v!=null))];
  if(!vals.length){c.fillStyle='#5b6375';c.font='13px Inter';c.textAlign='center';c.fillText('Sem dados ainda',W/2,H/2);return}
  let mn=o.yMin!=null?o.yMin:Math.min(...vals),mx=Math.max(...vals,o.yMaxMin||0);if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.12;if(o.yMin==null)mn-=pad;mx+=pad;
  const n=o.labels.length;const X=i=>L+(n<=1?pw/2:(o.bars?(i+.5)*pw/n:i*pw/(n-1)));const Y=v=>T+ph-(v-mn)/(mx-mn)*ph;
  c.strokeStyle='#1e2430';c.lineWidth=1;c.fillStyle='#5b6375';c.font='10px Inter';c.textAlign='right';
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;const y=Y(v);c.beginPath();c.moveTo(L,y);c.lineTo(W-R,y);c.stroke();c.fillText(o.fmtY?o.fmtY(Math.round(v*10)/10):v,L-6,y+3)}
  c.textAlign='center';const step=Math.ceil(n/7);o.labels.forEach((l,i)=>{if(i%step===0||i===n-1)c.fillText(l,X(i),H-8)});
  if(o.bars){const bw=Math.min(26,pw/n*.6);o.bars.forEach((v,i)=>{const y=Y(v),x=X(i)-bw/2;const g=c.createLinearGradient(0,y,0,T+ph);g.addColorStop(0,'#ffcf3f');g.addColorStop(1,'rgba(242,183,5,.25)');c.fillStyle=v?g:'#1e2430';
    const hh=Math.max(2,T+ph-y);c.beginPath();c.roundRect?c.roundRect(x,T+ph-hh,bw,hh,5):c.rect(x,T+ph-hh,bw,hh);c.fill();if(v){c.fillStyle='#e9ebf1';c.font='600 11px Oxanium, Roboto, sans-serif';c.fillText(v,X(i),T+ph-hh-4)}})}
  (o.lines||[]).forEach(l=>{c.lineWidth=l.width||2.5;c.strokeStyle=l.color;c.setLineDash(l.dash||[]);c.shadowColor=l.dash?'transparent':l.color;c.shadowBlur=l.dash?0:8;c.beginPath();let st=false;
    l.data.forEach((v,i)=>{if(v==null)return;const x=X(i),y=Y(v);st?c.lineTo(x,y):c.moveTo(x,y);st=true});c.stroke();c.shadowBlur=0;c.setLineDash([]);
    if(l.fill&&l.data.length>1){const g=c.createLinearGradient(0,T,0,T+ph);g.addColorStop(0,'rgba(242,183,5,.25)');g.addColorStop(1,'rgba(242,183,5,0)');c.fillStyle=g;c.lineTo(X(l.data.length-1),T+ph);c.lineTo(X(0),T+ph);c.closePath();c.fill()}
    if(!l.noDots)l.data.forEach((v,i)=>{if(v==null)return;c.fillStyle='#050608';c.strokeStyle=l.color;c.lineWidth=2;c.beginPath();c.arc(X(i),Y(v),l.dot||3.5,0,7);c.fill();c.stroke()})});
}

  {t:'Queijo e castanhas',i:[['mus',50,'P'],['castanha',15,'G']]}],
 [{t:'Frango com brócolis',i:[['frango',200,'P'],['brocolis',150,'V'],['manteiga',10,'G'],['folhas',60,'V']]},
  {t:'Omelete recheada',i:[['ovo',200,'P'],['mus',40,'G'],['folhas',60,'V'],['azeite',10,'G']]},
  {t:'Carne moída com queijo',i:[['patinho',160,'P'],['mus',30,'G'],['abobrinha',150,'V']]}]];
function calc(){const p=S.perfil;const w=pesoAtual(),alt=num(p.altura),idade=num(p.idade);if(!w||!alt||!idade)return null;
  const tmb=10*w+6.25*alt-5*idade+(p.sexo==='M'?5:-161);const get=tmb*p.ativ;const def=p.ritmo*7700/7;let meta=get-def;const piso=p.sexo==='M'?1500:1200;const travado=meta<piso;if(travado)meta=piso;
  const prot=Math.round(1.6*w);const carb=25;const gord=Math.max(40,Math.round((meta-prot*4-carb*4)/9));
  return {w,alt,idade,tmb,get,def,meta,prot,carb,gord,imc:w/((alt/100)**2),travado}}
function planoEscalado(r){
  const sel=OPC.map((o,i)=>o[S.cardapio[i]||0]||o[0]);
  let pP=0,kP=0,kG=0,kV=0,pOut=0;
  sel.forEach(m=>m.i.forEach(([f,g,t])=>{const F=FOOD[f],kk=F.k*g/100;if(t==='P'){pP+=F.p*g/100;kP+=kk}else{pOut+=F.p*g/100;if(t==='G')kG+=kk;else kV+=kk}}));
  const fp=Math.max(.5,(r.prot-pOut)/pP);const fg=Math.min(2.5,Math.max(.3,(r.meta-kP*fp-kV)/kG));
  const r5=v=>Math.max(5,Math.round(v/5)*5);const tot={k:0,p:0,g:0,c:0};
  const meals=sel.map((m,mi)=>{let mp=0,mk=0;const items=m.i.map(([f,g,t])=>{let q=t==='P'?g*fp:t==='G'?g*fg:g;q=f==='ovo'?Math.max(1,Math.round(q/50))*50:r5(q);
    const F=FOOD[f];mp+=F.p*q/100;mk+=F.k*q/100;tot.k+=F.k*q/100;tot.p+=F.p*q/100;tot.g+=F.g*q/100;tot.c+=F.c*q/100;return {f,q}});
    return {n:REFEICOES[mi],t:m.t,x:m.x,i:items,p:mp,k:mk}});
  return {meals,tot};
}
function qTxt(f,q){const F=FOOD[f];if(F.u){const u=Math.round(q/F.u);return `${u} ${F.uL}${u>1?'s':''}`}if(f==='azeite')return `${q} g (≈${fmt(q/13,1)} col. sopa)`;if(f==='manteiga')return `${q} g (≈${fmt(q/10,1)} col. chá cheia)`;return q+' g'}
function stepPeso(w,meta){const p=S.perfil;const tmb=10*w+6.25*num(p.altura)-5*num(p.idade)+(p.sexo==='M'?5:-161);return w-Math.max(0,tmb*p.ativ-meta)*7/7700}
function projetar(sem){const r=calc();let w=r.w;for(let i=0;i<sem;i++)w=stepPeso(w,r.meta);return w}

function aguaMeta(){const w=pesoAtual();if(!w)return 2500;return Math.round(w*35/50)*50+(treinouHoje()?500:0)}
function aguaCard(compact){const v=S.agua[today()]||0,m=aguaMeta(),pct=Math.min(100,Math.round(v/m*100));
  return `<div class="card"><div class="row between"><h3 style="margin:0">Água hoje</h3><span class="sub small">meta ${fmt(m/1000,1)} L${treinouHoje()?' · dia de treino':''}</span></div>

/* ----- proteína ----- */
function protRec(){const d=today();return S.prot[d]||(S.prot[d]={m:[],x:0})}
function protCard(){const r=calc();if(!r)return '';const pl=planoEscalado(r);const rec=S.prot[today()]||{m:[],x:0};
  const tot=Math.round(rec.m.reduce((s,i)=>s+(pl.meals[i]?pl.meals[i].p:0),0)+rec.x);const pct=Math.min(100,Math.round(tot/r.prot*100));

  <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"><span class="sub small">Extra:</span>${[10,20,30].map(g=>`<button class="btn sm" onclick="addProt(${g})">+${g} g</button>`).join('')}<button class="btn sm ghost" onclick="addProt(-10)">−10</button></div></div>`}
function togMeal(i){const r=protRec();r.m=r.m.includes(i)?r.m.filter(x=>x!==i):[...r.m,i];save();rr()}
function addProt(g){const r=protRec();r.x=Math.max(0,r.x+g);save();rr()}

/* ----- medicação semanal ----- */
const SINT=['Bem','Enjoo','Sem apetite','Cansaço','Azia','Intestino preso','Intestino solto','Dor de cabeça'];
function proxMed(){const regs=S.med.regs;if(regs.length){const d=new Date(regs[regs.length-1].data+'T12:00');d.setDate(d.getDate()+7);return d}
  if(S.med.dia!==''&&S.med.dia!=null){const d=new Date();d.setHours(12,0,0,0);while(d.getDay()!==+S.med.dia)d.setDate(d.getDate()+1);return d}return null}
function medCard(){const n=proxMed();const h0=new Date();h0.setHours(12,0,0,0);const dias=n?Math.round((n-h0)/864e5):null;const last=S.med.regs[S.med.regs.length-1];

function setP(k,v){const n=num(v);if(n==null||n<=0)return;S.perfil[k]=n;save();rr()}
function setMeta(v){const n=num(v);S.perfil.metaPeso=n&&n>30?n:'';save();rr()}
function novoPeso(v){const n=num(v);if(n==null||n<30||n>350){toast('Peso inválido');return}const d=today();const ex=S.pesos.find(x=>x.data===d);if(ex)ex.kg=n;else S.pesos.push({data:d,kg:n});S.pesos.sort((a,b)=>a.data.localeCompare(b.data));S.perfil.peso=n;save();toast('Peso registrado');rr()}
function drawDieta(){
  const r=calc();if(!r||!$('#cProj'))return;const N=16;const ini=S.pesos.length?S.pesos[0]:{data:today(),kg:r.w};
  const t0=new Date(ini.data+'T12:00');const wk=Math.max(0,Math.floor((new Date()-t0)/(7*864e5)));
  const labels=[...Array(N+wk+1)].map((_,i)=>'S'+i);
  const proj=labels.map((_,i)=>{if(i<wk)return null;let w=r.w;for(let k=wk;k<i;k++)w=stepPeso(w,r.meta);return w});
  const lo=labels.map((_,i)=>i<wk?null:r.w-0.7*(i-wk)),hi=labels.map((_,i)=>i<wk?null:r.w-1*(i-wk));
  const real=labels.map(()=>null);S.pesos.forEach(x=>{const i=Math.round((new Date(x.data+'T12:00')-t0)/(7*864e5));if(i>=0&&i<real.length)real[i]=x.kg});
  const lines=[{data:lo,color:'rgba(90,169,255,.5)',dash:[5,5],width:1.5,noDots:true},{data:hi,color:'rgba(90,169,255,.5)',dash:[5,5],width:1.5,noDots:true},{data:proj,color:'#f2b705',noDots:true,fill:true},{data:real,color:'#33d17a',dot:4.5}];
  chart($('#cProj'),{labels,lines,fmtY:v=>fmt(v)});
}

async function copiar(txt,msg){try{await navigator.clipboard.writeText(txt);toast(msg)}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast(msg)}catch(e2){toast('Não consegui copiar')}t.remove()}}
function receberTreinos(){

  let pk=null;
  const parse=t=>{t=t.trim();if(t.startsWith('NOCTIS:'))t=decodeURIComponent(escape(atob(t.slice(7).replace(/\s/g,''))));const d=JSON.parse(t);if(d.tipo!=='noctis-treinos'||!Array.isArray(d.treinos))throw 0;return d};
  m.querySelector('#rtFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{pk=parse(rd.result);toast(pk.treinos.length+' treino(s) prontos. Escolha adicionar ou substituir.')}catch(x){toast('Arquivo inválido')}};rd.readAsText(f)};
  const apply=rep=>{try{if(!pk)pk=parse($('#rtCode').value)}catch(x){toast('Código inválido');return}
    Object.entries(pk.ex||{}).forEach(([id,e])=>{if(!S.ex[id])S.ex[id]=e});
    if(rep)S.treinos=JSON.parse(JSON.stringify(pk.treinos));
    else pk.treinos.forEach(t=>{let id=t.id;if(tById(id)){for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){if(!tById(c)){id=c;break}}}S.treinos.push(Object.assign(JSON.parse(JSON.stringify(t)),{id,nome:'Treino '+id}))});
    save();closeModals();go('treinos');toast('Treinos importados'+(pk.de?' de '+pk.de:''))};
  m.querySelector('#rtAdd').onclick=()=>apply(false);
  m.querySelector('#rtRep').onclick=()=>confirmBox('Substituir todos os seus treinos pelos recebidos? Seu histórico continua.',()=>apply(true));
}

/* ===================== AJUSTES ===================== */
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(view==='ajustes')rr()});
function vAjustes(){
  const size=(()=>{try{return (localStorage.getItem(KEY)||'').length}catch(e){return 0}})();
  let h=header('Ajustes','perfil, treino e backup');
  h+=`<div class="card"><h3>Instalar no celular</h3>${deferredPrompt?`<button class="btn pri block" onclick="deferredPrompt.prompt();deferredPrompt=null">Instalar NOCTIS na tela inicial</button>`:
   `<div class="sub"><b>Android:</b> Chrome › menu ⋮ › <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.<br><b>iPhone:</b> Safari › <b>Compartilhar</b> › <b>Adicionar à Tela de Início</b>.</div>`}
   <button class="btn block" style="margin-top:10px" onclick="copiar(location.origin+location.pathname,'Link copiado. Mande para quem quiser usar.')">Copiar link do app para enviar</button>
   <div class="sub small" style="margin-top:6px">Quem abrir pelo link cadastra os próprios dados. Nada seu vai junto.</div></div>
  <div class="card"><h3>Treino</h3><div class="field" style="margin:0"><label>Descanso entre um exercício e outro</label><select onchange="S.cfg.transicao=+this.value;save()">${[[0,'Desligado'],[60,'1 minuto'],[90,'1 min 30 s'],[120,'2 minutos'],[180,'3 minutos']].map(([v,l])=>`<option value="${v}" ${S.cfg.transicao===v?'selected':''}>${l}</option>`).join('')}</select></div>
   <div class="sub small" style="margin-top:6px">O descanso entre séries é definido em cada exercício (Treinos › lápis).</div></div>
  <div class="card"><label class="switch"><div><h3 style="margin:0">Medicação semanal</h3><div class="sub small">Mostra a próxima aplicação no Início e guarda o histórico.</div></div><input type="checkbox" ${S.med.on?'checked':''} onchange="S.med.on=this.checked;save();rr()"></label>
   ${S.med.on?`<div class="hr"></div><div class="field"><label>Nome</label><input value="${esc(S.med.nome)}" placeholder="Nome do remédio" onchange="S.med.nome=this.value.trim();save()"></div>
   <div class="grid2"><div class="field"><label>Dose atual</label><input value="${esc(S.med.dose)}" placeholder="ex.: 5 mg" onchange="S.med.dose=this.value.trim();save()"></div>
   <div class="field"><label>Dia da aplicação</label><select onchange="S.med.dia=this.value;save()"><option value="">—</option>${DIAS.map((d,i)=>`<option value="${i}" ${String(S.med.dia)===String(i)?'selected':''}>${d}</option>`).join('')}</select></div></div>`:''}</div>
  <div class="card"><h3>Busca automática de vídeos</h3><div class="sub" style="margin-bottom:10px">Já vem ativada para todo mundo. Só preencha se quiser usar uma chave própria da YouTube Data API.</div>
   <div class="field"><input id="ytk" type="password" autocomplete="off" value="${esc(ytKeyCustom())}" placeholder="Usando a chave padrão do app"></div>
   <div class="grid2"><button class="btn" onclick="salvarKey()">Salvar</button><button class="btn" onclick="testarKey()">Testar busca</button></div><div id="ytTest" class="sub small" style="margin-top:10px"></div></div>
  <div class="card"><h3>Backup dos seus dados</h3><div class="sub" style="margin-bottom:12px">Tudo fica salvo só neste celular (${fmt(size/1024)} KB${S.fotos.length?' + '+S.fotos.length+' foto(s)':''}). Faça backup de vez em quando: se trocar de aparelho ou limpar os dados do navegador, é ele que recupera seu histórico.</div>
   <div class="grid2"><button class="btn" onclick="exportar()">Exportar backup</button><label class="btn" style="cursor:pointer">Importar backup<input type="file" accept=".json,application/json" style="display:none" onchange="importar(this.files[0])"></label></div></div>
  <div class="card"><h3>Restaurar</h3><div class="grid2"><button class="btn" onclick="confirmBox('Trazer de volta os treinos modelo A, B, C e D? Seus treinos atuais serão substituídos; histórico e pesagens ficam.',()=>{S.treinos=JSON.parse(JSON.stringify(SEED_TREINOS));Object.entries(seedEx()).forEach(([k,e])=>{if(!S.ex[k])S.ex[k]=e});save();toast('Treinos modelo restaurados')})">Treinos modelo</button>
   <button class="btn danger" onclick="confirmBox('Apagar TUDO (perfil, treinos, histórico, pesagens, fotos)? Não tem volta.',async()=>{try{await DB.clear()}catch(e){}S=defaults();save();go('home')})">Apagar tudo</button></div></div>
  <div class="sign">${ASSINATURA}<br>NOCTIS · versão ${VERSAO} · funciona offline</div>`;
  return h;
}
async function exportar(){
  const out=JSON.parse(JSON.stringify(S));out._fotos={};
  for(const f of S.fotos){try{const d=await DB.get(f.id);if(d)out._fotos[f.id]=d}catch(e){}}
  const b=new Blob([JSON.stringify(out)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='noctis-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup gerado');
}
function importar(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.treinos||!d.ex)throw 0;
  confirmBox('Substituir os dados atuais por este backup?',async()=>{const fotos=d._fotos||{};delete d._fotos;for(const id in fotos){try{await DB.put(id,fotos[id])}catch(e){}}
    S=migrate(d);S.onboarded=true;save();toast('Backup restaurado');go('home')})}catch(e){toast('Arquivo inválido')}};r.readAsText(f)}

/* ===================== START ===================== */
if(S.ativa&&S.onboarded)view='sessao';
render();
window.addEventListener('resize',()=>{if(view==='evol')drawEvol();if(view==='dieta')drawDieta()});
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
